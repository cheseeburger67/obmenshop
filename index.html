<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obmen Shop</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #111111;
}

/* ОБЩЕЕ */

.page {
    display: none;
    min-height: 100vh;
}

.page.active {
    display: flex;
}

/* СТАРТОВАЯ */

#startPage {
    justify-content: center;
    align-items: center;
}

.start-box {
    width: 420px;
    height: 590px;
    border: 4px solid #111;
    border-radius: 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 50px;
}

.logo {
    border: 4px solid #111;
    border-radius: 20px;
    width: 230px;
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    margin-bottom: 55px;
}

.main-button {
    width: 350px;
    height: 65px;
    border: 4px solid #111;
    border-radius: 25px;
    background: white;
    font-size: 21px;
    cursor: pointer;
    margin-bottom: 35px;
}

.main-button:hover {
    background: #f1f1f1;
}

/* ВХОД И РЕГИСТРАЦИЯ */

.auth-box {
    width: 360px;
    min-height: 570px;
    border: 4px solid #111;
    border-radius: 35px;
    padding: 145px 25px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.auth-input {
    width: 285px;
    height: 65px;
    border: 4px solid #111;
    border-radius: 25px;
    font-size: 20px;
    padding: 0 18px;
    outline: none;
    margin-bottom: 18px;
}

.auth-input:focus {
    background: #fafafa;
}

.auth-button {
    width: 295px;
    height: 65px;
    border: 4px solid #111;
    border-radius: 25px;
    background: white;
    font-size: 20px;
    cursor: pointer;
    margin-top: 15px;
}

.auth-button:hover {
    background: #f1f1f1;
}

.back-button {
    border: none;
    background: none;
    font-size: 16px;
    cursor: pointer;
    margin-top: 25px;
}

.message {
    min-height: 25px;
    margin-top: 15px;
    text-align: center;
    font-size: 15px;
}

/* ГЛАВНАЯ */

#homePage {
    flex-direction: column;
}

.header {
    height: 110px;
    border-bottom: 3px solid #111;
    display: flex;
    align-items: center;
    padding: 0 55px;
    gap: 20px;
}

.search {
    width: 310px;
    height: 55px;
    border: 3px solid #111;
    border-radius: 20px;
    padding: 0 15px;
    font-size: 16px;
}

.shop-button {
    width: 160px;
    height: 55px;
    border: 3px solid #111;
    border-radius: 20px;
    background: white;
    font-size: 17px;
    cursor: pointer;
}

.spacer {
    flex: 1;
}

.balance {
    height: 55px;
    min-width: 110px;
    border: 3px solid #111;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.plus {
    width: 30px;
    height: 30px;
    border: 2px solid #111;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
}

.profile {
    height: 55px;
    min-width: 170px;
    border: 3px solid #111;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.avatar {
    width: 35px;
    height: 35px;
    border: 2px solid #111;
    border-radius: 10px;
}

.logout {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
}

.home-content {
    padding: 50px;
}

.home-content h1 {
    font-size: 38px;
}

.home-content p {
    font-size: 19px;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 700px) {

    .start-box {
        width: 90%;
    }

    .main-button {
        width: 85%;
    }

    .auth-box {
        width: 90%;
    }

    .auth-input,
    .auth-button {
        width: 90%;
    }

    .header {
        padding: 15px;
        height: auto;
        flex-wrap: wrap;
    }

    .search {
        width: 100%;
    }

    .spacer {
        display: none;
    }
}
</style>
</head>

<body>

<!-- ========================= -->
<!-- СТАРТОВАЯ СТРАНИЦА -->
<!-- ========================= -->

<section id="startPage" class="page active">

    <div class="start-box">

        <div class="logo">
            obmen shop
        </div>

        <button class="main-button" onclick="showPage('loginPage')">
            ВОЙТИ
        </button>

        <button class="main-button" onclick="showPage('registerPage')">
            ЗАРЕГИСТРИРОВАТЬСЯ
        </button>

    </div>

</section>


<!-- ========================= -->
<!-- СТРАНИЦА ВХОДА -->
<!-- ========================= -->

<section id="loginPage" class="page">

    <div class="auth-box">

        <input
            id="loginEmail"
            class="auth-input"
            type="email"
            placeholder="ПОЧТА"
        >

        <input
            id="loginPassword"
            class="auth-input"
            type="password"
            placeholder="ПАРОЛЬ"
        >

        <button class="auth-button" onclick="login()">
            ВОЙТИ
        </button>

        <div id="loginMessage" class="message"></div>

        <button class="back-button" onclick="showPage('startPage')">
            ← Назад
        </button>

    </div>

</section>


<!-- ========================= -->
<!-- СТРАНИЦА РЕГИСТРАЦИИ -->
<!-- ========================= -->

<section id="registerPage" class="page">

    <div class="auth-box">

        <input
            id="registerEmail"
            class="auth-input"
            type="email"
            placeholder="ПОЧТА"
        >

        <input
            id="registerPassword"
            class="auth-input"
            type="password"
            placeholder="ПАРОЛЬ"
        >

        <input
            id="registerPassword2"
            class="auth-input"
            type="password"
            placeholder="ПОВТОРИТЕ ПАРОЛЬ"
        >

        <button class="auth-button" onclick="register()">
            ЗАРЕГИСТРИРОВАТЬСЯ
        </button>

        <div id="registerMessage" class="message"></div>

        <button class="back-button" onclick="showPage('startPage')">
            ← Назад
        </button>

    </div>

</section>


<!-- ========================= -->
<!-- ГЛАВНАЯ ПОСЛЕ ВХОДА -->
<!-- ========================= -->

<section id="homePage" class="page">

    <header class="header">

        <input
            class="search"
            placeholder="ПОИСК ТРЕЙДОВ ПО НАЗВАНИЮ ПЕТОВ"
        >

        <button class="shop-button">
            МАГАЗИН
        </button>

        <div class="spacer"></div>

        <div class="balance">
            <span>БАЛАНС</span>
            <span class="plus">+</span>
        </div>

        <div class="profile">

            <div class="avatar"></div>

            <span id="userNick">
                НИК
            </span>

            <button class="logout" onclick="logout()">
                Выйти
            </button>

        </div>

    </header>

    <main class="home-content">

        <h1>
            Добро пожаловать в Obmen Shop
        </h1>

        <p>
            Здесь будет система обмена питомцами.
        </p>

    </main>

</section>


<script>

/* ========================= */
/* ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ */
/* ========================= */

function showPage(pageId) {

    document.querySelectorAll('.page').forEach(function(page) {
        page.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');

}


/* ========================= */
/* РЕГИСТРАЦИЯ */
/* ========================= */

function register() {

    const email =
        document.getElementById('registerEmail').value.trim();

    const password =
        document.getElementById('registerPassword').value;

    const password2 =
        document.getElementById('registerPassword2').value;

    const message =
        document.getElementById('registerMessage');


    if (!email || !password || !password2) {

        message.textContent =
            'Заполните все поля';

        return;
    }


    if (password.length < 6) {

        message.textContent =
            'Пароль должен содержать минимум 6 символов';

        return;
    }


    if (password !== password2) {

        message.textContent =
            'Пароли не совпадают';

        return;
    }


    if (localStorage.getItem('obmen_user')) {

        const oldUser =
            JSON.parse(localStorage.getItem('obmen_user'));

        if (oldUser.email === email) {

            message.textContent =
                'Этот аккаунт уже существует';

            return;
        }
    }


    const user = {

        email: email,

        password: password,

        nick: email.split('@')[0]

    };


    localStorage.setItem(
        'obmen_user',
        JSON.stringify(user)
    );


    message.textContent =
        'Аккаунт создан!';


    setTimeout(function() {

        showPage('loginPage');

    }, 1000);

}


/* ========================= */
/* ВХОД */
/* ========================= */

function login() {

    const email =
        document.getElementById('loginEmail').value.trim();

    const password =
        document.getElementById('loginPassword').value;

    const message =
        document.getElementById('loginMessage');


    const savedUser =
        localStorage.getItem('obmen_user');


    if (!savedUser) {

        message.textContent =
            'Аккаунт не найден. Сначала зарегистрируйтесь.';

        return;
    }


    const user =
        JSON.parse(savedUser);


    if (
        user.email !== email ||
        user.password !== password
    ) {

        message.textContent =
            'Неверная почта или пароль';

        return;
    }


    localStorage.setItem(
        'obmen_logged',
        'true'
    );


    document.getElementById('userNick').textContent =
        user.nick;


    showPage('homePage');

}


/* ========================= */
/* ВЫХОД */
/* ========================= */

function logout() {

    localStorage.removeItem('obmen_logged');

    showPage('startPage');

}


/* ========================= */
/* ПРОВЕРКА АВТОРИЗАЦИИ */
/* ========================= */

window.onload = function() {

    const logged =
        localStorage.getItem('obmen_logged');

    const savedUser =
        localStorage.getItem('obmen_user');


    if (logged === 'true' && savedUser) {

        const user =
            JSON.parse(savedUser);

        document.getElementById('userNick').textContent =
            user.nick;

        showPage('homePage');

    }

};

</script>

</body>
</html>
